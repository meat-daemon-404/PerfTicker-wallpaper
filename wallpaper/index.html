<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PerfTicker 行情壁纸</title>
  <script>
    window.__ptErr = '';
    window.addEventListener('error', function (e) {
      window.__ptErr = (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0);
      document.title = 'ERR: ' + window.__ptErr;
      try { console.error('[PerfTicker]', window.__ptErr); } catch (_) {}
    });
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06080c; }
    #stage { display: block; position: fixed; inset: 0; }
    /* 兜底提示（脚本未就绪时短暂出现） */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #465060; font: 13px "Microsoft YaHei UI", sans-serif; letter-spacing: 2px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script src="js/theme.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/procs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
